[versions]
accompanist = "0.37.3"
agp = "8.13.0"
kotlin = "2.2.20"
kotlin-ksp = "2.2.20-2.0.3"
coreKtx = "1.17.0"
junit = "4.13.2"
junitVersion = "1.3.0"
espressoCore = "3.7.0"
lifecycleRuntimeKtx = "2.9.4"
activityCompose = "1.11.0"

bom-compose = "2025.10.00"

#   Koin
koin-annotation = "2.2.0"
koin-bom = "4.1.2-Beta1"

arrow = "2.1.2"
appcompat = "1.7.1"
material = "1.13.0"
paging = "3.3.6"
room = "2.8.2"
workmanager = "2.10.5"

[libraries]
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
junit = { group = "junit", name = "junit", version.ref = "junit" }
androidx-junit = { group = "androidx.test.ext", name = "junit", version.ref = "junitVersion" }
androidx-espresso-core = { group = "androidx.test.espresso", name = "espresso-core", version.ref = "espressoCore" }
androidx-lifecycle-runtime-ktx = { group = "androidx.lifecycle", name = "lifecycle-runtime-ktx", version.ref = "lifecycleRuntimeKtx" }
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }

#   Accompanist Permission
accompanist-permission = { module = "com.google.accompanist:accompanist-permissions", version.ref = "accompanist" }

#   Arrow
arrow-bom = { module = "io.arrow-kt:arrow-stack", version.ref = "arrow" }
arrow-core = { module = "io.arrow-kt:arrow-core" }
arrow-optic = { module = "io.arrow-kt:arrow-optics" }
arrow-optic-ksp = { module = "io.arrow-kt:arrow-optics-ksp-plugin", version.ref = "arrow" }






#   Compose
compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "bom-compose" }
compose-icon = { group = "androidx.compose.material", name = "material-icons-extended" }
compose-ui = { group = "androidx.compose.ui", name = "ui" }
compose-ui-graphics = { group = "androidx.compose.ui", name = "ui-graphics" }
compose-lifecycle = { module = "androidx.lifecycle:lifecycle-runtime-compose" }
compose-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling" }
compose-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
compose-ui-test-manifest = { group = "androidx.compose.ui", name = "ui-test-manifest" }
compose-ui-test-junit4 = { group = "androidx.compose.ui", name = "ui-test-junit4" }
compose-material3 = { group = "androidx.compose.material3", name = "material3", version = "1.5.0-alpha06" }

#   Firebase
firebase-bom = { module = "com.google.firebase:firebase-bom", version = "34.4.0" }
firebase-crashlytics = { module = "com.google.firebase:firebase-analytics" }
firebase-analytics = { module = "com.google.firebase:firebase-crashlytics" }

#   Itext
itext = { module = "com.itextpdf:itext7-core", version = "9.3.0" }

#   Koin
koin-bom = { module = "io.insert-koin:koin-bom", version.ref = "koin-bom" }
koin-android = { module = "io.insert-koin:koin-android" }
koin-annotation = { module = "io.insert-koin:koin-annotations", version.ref = "koin-annotation" }
koin-annotation-ksp = { module = "io.insert-koin:koin-ksp-compiler", version.ref = "koin-annotation" }
koin-core = { module = "io.insert-koin:koin-core" }
koin-compose-viewmodel = { module = "io.insert-koin:koin-compose-viewmodel" }
koin-compose-viewmodel-navigation = { module = "io.insert-koin:koin-compose-viewmodel-navigation" }
koin-compose = { module = "io.insert-koin:koin-androidx-compose" }
koin-compose-navigation = { module = "io.insert-koin:koin-androidx-compose-navigation" }
koin-workmanager = { module = "io.insert-koin:koin-androidx-workmanager" }

#   Paging
paging = { module = "androidx.paging:paging-common", version.ref = "paging" }
paging-compose = { module = "androidx.paging:paging-compose", version.ref = "paging" }

#   QR
qr-generator = { module = "io.github.g0dkar:qrcode-kotlin", version = "4.5.0" }

#   Retable
retable = { module = "com.github.4sh:retable", version = "0.2.8" }

#   Room
room = { module = "androidx.room:room-runtime", version.ref = "room" }
room-paging = { module = "androidx.room:room-paging" }
room-compiler = { module = "androidx.room:room-compiler", version.ref = "room" }

#   Serialization
serialization = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version = "1.9.0" }

#   Workmanager
workmanager = { module = "androidx.work:work-runtime-ktx", version.ref = "workmanager" }

androidx-appcompat = { group = "androidx.appcompat", name = "appcompat", version.ref = "appcompat" }
material = { group = "com.google.android.material", name = "material", version.ref = "material" }

[bundles]
compose = [
    "compose-icon",
    "compose-lifecycle",
    "compose-material3",
    "compose-ui",
    "compose-ui-graphics",
    "compose-ui-tooling-preview",
    "compose-ui-tooling",
]

firebase = [
    "firebase-analytics",
    "firebase-crashlytics",
]

koin = [
    "koin-core",
    "koin-android",
    "koin-annotation",
]

koin-compose = [
    "koin-compose",
    "koin-compose-navigation",
    "koin-compose-viewmodel",
    "koin-compose-viewmodel-navigation",
]

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlin-ksp = { id = "com.google.devtools.ksp", version.ref = "kotlin-ksp" }
android-library = { id = "com.android.library", version.ref = "agp" }
room = { id = "androidx.room", version.ref = "room" }
serialization = { id = "plugin.serialization", version = "2.1.21" }

